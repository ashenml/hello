<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        cyber: {
                            pink: '#ff007f',
                            cyan: '#00f3ff',
                            purple: '#8a2be2'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Cyber/Neon theme glass override */
        .theme-neon .glass-card {
            background: rgba(10, 10, 24, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        }

        /* Interactive Canvas Backdrop */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 3D tilt card container */
        .tilt-card-wrapper {
            perspective: 1000px;
        }

        .tilt-card {
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        /* Pulse aura animation */
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.08); opacity: 0.8; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        /* Toast notification placement */
        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white relative">

    <canvas id="bg-canvas"></canvas>

    <!-- Navigation Header -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-6 pb-2">
        <nav class="glass-card rounded-2xl px-5 py-3.5 flex items-center justify-between shadow-lg shadow-black/5">
            <!-- Brand / Logo -->
            <div class="flex items-center space-x-3 cursor-pointer group" id="logo-btn">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-lg shadow-md group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-graduation-cap text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-base tracking-tight block leading-none">Ashen Maleesha</span>
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-mono">@ashenml</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- University Status Badge -->
                <div class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>Student</span>
                </div>

                <!-- Sound Toggle Button -->
                <button id="sound-btn" title="Toggle Sound Effects" class="p-2.5 rounded-xl hover:bg-slate-200/50 dark:hover:bg-slate-800/60 transition-colors text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-volume-high text-sm" id="sound-icon"></i>
                </button>

                <!-- Theme Switcher Menu -->
                <div class="relative">
                    <button id="theme-btn" title="Change Theme" class="p-2.5 rounded-xl hover:bg-slate-200/50 dark:hover:bg-slate-800/60 transition-colors text-slate-600 dark:text-slate-300">
                        <i class="fa-solid fa-palette text-sm"></i>
                    </button>
                    <!-- Theme Dropdown Menu -->
                    <div id="theme-menu" class="hidden absolute right-0 mt-2 w-36 glass-card rounded-xl p-2 shadow-xl border border-slate-200 dark:border-slate-800 z-20 space-y-1">
                        <button onclick="setTheme('light')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between hover:bg-blue-500/10 hover:text-blue-600">
                            <span>Light</span> <i class="fa-solid fa-sun text-amber-500"></i>
                        </button>
                        <button onclick="setTheme('dark')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between hover:bg-blue-500/10 hover:text-blue-400">
                            <span>Dark</span> <i class="fa-solid fa-moon text-indigo-400"></i>
                        </button>
                        <button onclick="setTheme('neon')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between hover:bg-cyan-500/10 hover:text-cyan-400">
                            <span>Cyber</span> <i class="fa-solid fa-bolt text-cyan-400"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

    <main class="relative z-10 my-auto py-8 px-4 flex items-center justify-center">
        <div class="w-full max-w-xl tilt-card-wrapper">
            <!-- 3D Interactive Main Profile Card -->
            <div id="hero-card" class="tilt-card glass-card rounded-3xl p-6 sm:p-10 shadow-2xl relative overflow-hidden transition-all duration-300">
                
                <!-- Background Ambient Glow Effects -->
                <div class="absolute -top-20 -right-20 w-56 h-56 bg-blue-500/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
                <div class="absolute -bottom-20 -left-20 w-56 h-56 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>

                <!-- Card Content Header -->
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left relative z-10">
                    
                    <!-- Avatar Graphic -->
                    <div class="relative group cursor-pointer" id="avatar-container">
                        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-cyan-400 p-1 shadow-xl transform transition-transform group-hover:scale-105 group-hover:rotate-2">
                            <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center overflow-hidden relative">
                                <i class="fa-solid fa-user-graduate text-4xl text-blue-400 transition-transform duration-300 group-hover:scale-110"></i>
                            </div>
                        </div>
                        <span class="absolute -bottom-1 -right-1 bg-emerald-500 border-2 border-white dark:border-slate-900 w-5 h-5 rounded-full shadow-md" title="Active Student"></span>
                    </div>

                    <!-- Identity & Dynamic Subtitle -->
                    <div class="space-y-2 flex-1">
                        <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-blue-500/10 text-xs font-semibold text-blue-600 dark:text-blue-400 border border-blue-500/20">
                            <span>🎓 Student</span>
                        </div>
                        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                            Ashen Maleesha
                        </h1>
                        <!-- Interactive Dynamic Typed Subtitle -->
                        <div class="text-sm font-mono text-slate-500 dark:text-slate-400 h-6 flex items-center justify-center sm:justify-start">
                            <span id="typed-text"></span><span class="animate-pulse text-blue-500 font-bold">|</span>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Introduction Box -->
                <div class="mt-6 pt-6 border-t border-slate-200/80 dark:border-slate-800/80 relative z-10">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold tracking-wider uppercase text-slate-400 dark:text-slate-500">Quick Intro</span>
                        <button id="new-intro-btn" class="text-xs font-medium text-blue-600 dark:text-blue-400 hover:underline flex items-center space-x-1 transition-all">
                            <i class="fa-solid fa-arrows-rotate text-xs"></i>
                            <span>Shuffle Intro</span>
                        </button>
                    </div>
                    
                    <p id="intro-paragraph" class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed italic bg-slate-100/60 dark:bg-slate-900/40 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 min-h-[80px] flex items-center transition-opacity duration-200">
                        "Just a university student."
                    </p>
                </div>

                

                <!-- Interactive Actions -->
                <div class="mt-8 flex flex-wrap gap-3 relative z-10">
                    <button id="wave-btn" class="flex-1 min-w-[140px] px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-hand-wave"></i>
                        <span>Send Wave (<span id="wave-count">0</span>)</span>
                    </button>
                    
                    <button id="note-modal-btn" class="px-4 py-3 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 active:scale-95 text-slate-800 dark:text-slate-100 font-semibold text-sm transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>Say Hello</span>
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Quick Note Modal Window -->
    <div id="note-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="modal-card">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-envelope text-blue-500"></i>
                    <span>Leave a Quick Note</span>
                </h3>
                <button id="close-modal-btn" class="w-8 h-8 rounded-full bg-slate-200/50 dark:bg-slate-800/50 hover:bg-slate-300 dark:hover:bg-slate-700 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            
            <form id="note-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Your Name</label>
                    <input type="text" required placeholder="Fellow Student / Friend" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Message</label>
                    <textarea required rows="3" placeholder="Say hi or share study tips!" class="w-full px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 transition-all">
                    Send Message 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Footer -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto px-4 py-6 text-center">
        <p class="text-xs text-slate-400 dark:text-slate-600 font-mono">
            Designed with Gemini AI• ©2026 <span id="year"></span>
        </p>
    </footer>

    <script>
        // Set dynamic current year
        document.getElementById('year').textContent = new Date().getFullYear();

        /* ==========================================
           1. AUDIO SYNTHESIZER (Web Audio API)
           ========================================== */
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(freq = 440, type = 'sine', duration = 0.15) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {
                // Ignore audio context initialization constraints
            }
        }

        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-sm';
                showToast('🔊 Audio Enabled');
                playSound(600, 'sine', 0.1);
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-sm';
                showToast('🔇 Audio Muted');
            }
        });

        /* ==========================================
           2. THEME SWITCHER
           ========================================== */
        const themeBtn = document.getElementById('theme-btn');
        const themeMenu = document.getElementById('theme-menu');

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            themeMenu.classList.toggle('hidden');
            playSound(500, 'sine', 0.1);
        });

        document.addEventListener('click', () => {
            themeMenu.classList.add('hidden');
        });

        function setTheme(mode) {
            document.body.classList.remove('theme-neon');
            document.documentElement.classList.remove('dark', 'light');

            if (mode === 'dark') {
                document.documentElement.classList.add('dark');
                showToast('🌙 Dark Mode');
            } else if (mode === 'light') {
                document.documentElement.classList.add('light');
                showToast('☀️ Light Mode');
            } else if (mode === 'neon') {
                document.documentElement.classList.add('dark');
                document.body.classList.add('theme-neon');
                showToast('⚡ Cyber Mode');
            }
            playSound(700, 'triangle', 0.2);
        }

        /* ==========================================
           3. CANVAS PARTICLE SYSTEM
           ========================================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null, radius: 120 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 1;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
            }

            draw() {
                const isDark = document.documentElement.classList.contains('dark');
                const isNeon = document.body.classList.contains('theme-neon');
                
                ctx.fillStyle = isNeon ? '#00f3ff' : (isDark ? 'rgba(148, 163, 184, 0.4)' : 'rgba(59, 130, 246, 0.4)');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x -= (dx / distance) * force * 3;
                        this.y -= (dy / distance) * force * 3;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.floor((canvas.width * canvas.height) / 18000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }

        resizeCanvas();
        animateCanvas();

        /* ==========================================
           4. 3D CARD TILT & TYPEWRITER EFFECT
           ========================================== */
        const heroCard = document.getElementById('hero-card');
        
        document.addEventListener('mousemove', (e) => {
            const rect = heroCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            const rotateX = (e.clientY - cardCenterY) / 35;
            const rotateY = (cardCenterX - e.clientX) / 35;

            heroCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            heroCard.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });

        // University Student Common Intros
        const randomIntros = [
            "Just a university student navigating lectures, group projects, late-night study sessions, and coffee runs.",
            "Juggling course assignments, exam prep, and finding the best quiet spots in the campus library.",
            "Learning step-by-step, balancing academics with passion projects, and surviving on iced coffee.",
            "Exploring new ideas, working through study guides, and enjoying the university experience.",
            "Curious learner spending time between classroom discussions, campus events, and coding tutorials."
        ];

        const subtitles = [
            "University Student",
            "Curious Learner",
            "Tech Enthusiast",
            "Campus Explorer"
        ];

        let introIndex = 0;
        const introParagraph = document.getElementById('intro-paragraph');
        const newIntroBtn = document.getElementById('new-intro-btn');

        newIntroBtn.addEventListener('click', () => {
            introIndex = (introIndex + 1) % randomIntros.length;
            introParagraph.style.opacity = '0';
            playSound(520, 'sine', 0.1);
            
            setTimeout(() => {
                introParagraph.textContent = `"${randomIntros[introIndex]}"`;
                introParagraph.style.opacity = '1';
            }, 200);
        });

        // Subtitle Typewriter
        let subIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typedTextSpan = document.getElementById('typed-text');

        function typeEffect() {
            const currentSub = subtitles[subIndex];
            
            if (isDeleting) {
                typedTextSpan.textContent = currentSub.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typedTextSpan.textContent = currentSub.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentSub.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                subIndex = (subIndex + 1) % subtitles.length;
                typeSpeed = 500;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        typeEffect();

        /* ==========================================
           5. INTERACTIVE BUTTONS & TOAST SYSTEM
           ========================================== */
        // Wave Button Counter
        let waveCount = 0;
        const waveBtn = document.getElementById('wave-btn');
        const waveCountSpan = document.getElementById('wave-count');

        waveBtn.addEventListener('click', () => {
            waveCount++;
            waveCountSpan.textContent = waveCount;
            playSound(300 + waveCount * 15, 'sine', 0.15);
            showToast(`👋 Wave sent! Total: ${waveCount}`);
        });

        // Interest Tags
        document.querySelectorAll('.interest-tag').forEach(tag => {
            tag.addEventListener('click', () => {
                const pitch = parseInt(tag.getAttribute('data-sound')) || 440;
                playSound(pitch, 'triangle', 0.18);
                showToast(`Clicked: ${tag.textContent.trim()}`);
            });
        });

        // Brand Logo Easter Egg
        document.getElementById('logo-btn').addEventListener('click', () => {
            playSound(800, 'sine', 0.2);
            showToast('🎓 Welcome to my student page!');
        });

        // Modal Controls
        const noteModalBtn = document.getElementById('note-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const noteModal = document.getElementById('note-modal');
        const modalCard = document.getElementById('modal-card');
        const noteForm = document.getElementById('note-form');

        function openModal() {
            noteModal.classList.remove('pointer-events-none');
            noteModal.classList.add('opacity-100');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
            playSound(450, 'sine', 0.15);
        }

        function closeModal() {
            noteModal.classList.add('pointer-events-none');
            noteModal.classList.remove('opacity-100');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            playSound(350, 'sine', 0.15);
        }

        noteModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        noteModal.addEventListener('click', (e) => {
            if (e.target === noteModal) closeModal();
        });

        noteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            closeModal();
            playSound(750, 'sine', 0.2);
            showToast('✨ Note sent! Thanks for stopping by.');
            noteForm.reset();
        });

        // Toast Notification Function
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-card text-xs font-semibold px-4 py-3 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 transform translate-y-4 opacity-0 transition-all duration-300 mb-2 flex items-center space-x-2';
            toast.innerHTML = `<span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
